<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Checker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
    button { font-size: 1.2rem; padding: 14px 28px; margin: 10px; }
    .container { display: inline-block; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sleep Checker Web</h1>
    <form action="{{ url_for('sleep_event') }}" method="post">
      <button type="submit">入眠</button>
    </form>
    <form action="{{ url_for('wake_event') }}" method="post">
      <button type="submit">起床</button>
    </form>
  </div>
</body>
</html>
